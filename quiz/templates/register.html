{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>Create Account</h1>


    <form method="POST">

        {% csrf_token %}


        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >


        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >


        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >


        <button
            type="submit"
            class="btn"
        >

            Register

        </button>

    </form>

</div>

{% endblock %}
