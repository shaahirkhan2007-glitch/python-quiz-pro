{% load static %}

<!DOCTYPE html>

<html>

<head>

    <title>Python Quiz Pro</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>


<body>


<nav>

    <h2>

        🧠 Python Quiz Pro

    </h2>


    <div>

        <a href="{% url 'home' %}">
            🏠 Home
        </a>

        <a href="{% url 'quiz' %}">
            🧠 Quiz
        </a>

        <a href="{% url 'leaderboard' %}">
            🏆 Leaderboard
        </a>


        {% if user.is_authenticated %}

        <a href="{% url 'dashboard' %}">
            📊 Dashboard
        </a>

        <a href="{% url 'logout' %}">
            🚪 Logout
        </a>

        {% else %}

        <a href="{% url 'login' %}">
            🔑 Login
        </a>

        <a href="{% url 'register' %}">
            📝 Register
        </a>

        {% endif %}

    </div>

</nav>


{% if messages %}

    {% for message in messages %}

        <div class="message">

            {{ message }}

        </div>

    {% endfor %}

{% endif %}


<main>

    {% block content %}

    {% endblock %}

</main>


<script src="{% static 'js/script.js' %}"></script>


</body>

</html>
