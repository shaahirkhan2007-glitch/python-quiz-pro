{% extends "base.html" %}

{% block content %}

<div class="hero">

    <h1>
        🧠 Test Your Python Knowledge
    </h1>

    <p>
        Answer Python questions and improve your skills.
    </p>


    {% if user.is_authenticated %}

    <a
        href="{% url 'quiz' %}"
        class="btn"
    >

        Start Quiz

    </a>

    {% else %}

    <a
        href="{% url 'login' %}"
        class="btn"
    >

        Login to Start

    </a>

    {% endif %}

</div>

{% endblock %}
